services:
  welstory-meal:
    build: .
    container_name: welstory-meal
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      WELSTORY_CACHE_DIR: /data/cache
    volumes:
      - welstory-cache:/data/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

volumes:
  welstory-cache:
