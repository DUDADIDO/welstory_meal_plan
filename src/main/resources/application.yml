server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
    min-response-size: 1024
  forward-headers-strategy: framework

spring:
  application:
    name: welstory-meal-plan
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  http:
    client:
      connect-timeout: 5s
      read-timeout: 15s
  task:
    scheduling:
      thread-name-prefix: meal-refresh-
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/welstory}
    username: ${SPRING_DATASOURCE_USERNAME:welstory}
    password: ${SPRING_DATASOURCE_PASSWORD:welstory}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

welstory:
  base-url: ${WELSTORY_BASE_URL:https://welplus.welstory.com}
  username: ${WELSTORY_USERNAME:}
  password: ${WELSTORY_PASSWORD:}
  restaurant-code: ${WELSTORY_RESTAURANT_CODE:REST000595}
  restaurant-name: ${WELSTORY_RESTAURANT_NAME:삼성전기 부산사업장}
  meal-type: ${WELSTORY_MEAL_TYPE:2}
  cache-dir: ${WELSTORY_CACHE_DIR:./data/cache}
  retry-interval: ${WELSTORY_RETRY_INTERVAL:5m}
  off-hours-retry-interval: ${WELSTORY_OFF_HOURS_RETRY_INTERVAL:30m}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
